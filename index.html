<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061522"><link rel="manifest" href="manifest.webmanifest"><title>SKUMBRIA BOULEVARD PREMIUM · Menu</title>
<style>
:root{--bg:#061522;--panel:#0c2233;--gold:#d6b16b;--gold2:#f0d8a1;--text:#f4efe5;--muted:#bdc7ce;--line:#d6b16b55}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#17384d,transparent 50%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.top{position:sticky;top:0;background:#061522f5;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px;z-index:3}.brand{max-width:980px;margin:auto;display:flex;align-items:center;gap:10px}.brand img{width:50px}.brand strong{font:22px Georgia,serif;letter-spacing:.13em;color:var(--gold2)}.sub{font-size:9px;letter-spacing:.15em;color:var(--muted)}.langs{margin-left:auto;display:flex;gap:4px}.lang,.cat,.close{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:8px}.lang.active,.cat.active{background:var(--gold);color:#111a20;font-weight:700}main{max-width:980px;margin:auto;padding:15px}.hero{padding:20px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(140deg,#102d41,#071522);margin-bottom:15px}.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.hero h1{font:38px Georgia,serif;color:var(--gold2);margin:7px 0}.hero p{font-size:13px;color:var(--muted);margin:0;line-height:1.5}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#0a2030;color:var(--text);font:inherit;margin:0 0 12px}.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cat{text-align:left;min-height:58px;background:linear-gradient(140deg,#102b3e,#091a27);padding:11px;font-size:12px}.head{display:flex;justify-content:space-between;align-items:end;margin:22px 0 12px}.head h2{font:25px Georgia,serif;color:var(--gold2);margin:0}.count{font-size:11px;color:var(--muted)}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid #d6b16b40;border-radius:13px;overflow:hidden;background:linear-gradient(140deg,#10283a,#091a27);display:flex;flex-direction:column}.card.signature{border:1.5px solid var(--gold)}.photo{aspect-ratio:4/3;background:#112d40;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:35px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:11px;display:flex;flex-direction:column;gap:7px;flex:1}.card h3{font:17px/1.25 Georgia,serif;margin:0}.desc{font-size:11px;line-height:1.5;color:var(--muted);margin:0}.price{color:var(--gold2);font-size:17px;font-weight:800;margin-top:auto}.badge{font-size:9px;letter-spacing:.1em;color:var(--gold2);border:1px solid var(--gold);padding:4px 6px;border-radius:5px;align-self:flex-start}.detail{display:none;position:fixed;inset:0;background:#02080edb;z-index:8;align-items:flex-end;justify-content:center;padding:10px}.detail.open{display:flex}.panel{width:min(700px,100%);max-height:93dvh;overflow:auto;background:#081b29;border:1px solid var(--gold);border-radius:18px;padding:15px}.detail-img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#102b3e;border-radius:10px}.close{float:right}.panel h2{font:27px Georgia,serif;color:var(--gold2)}.panel p{line-height:1.6;color:var(--muted);font-size:14px}.detail-price{font-size:22px;font-weight:800;color:var(--gold2)}.foot{text-align:center;color:#8294a0;font-size:10px;letter-spacing:.12em;padding:28px}.status{text-align:center;color:#9eafb9;font-size:10px;margin-top:12px}.empty{grid-column:1/-1;text-align:center;padding:25px;color:var(--muted)}@media(min-width:650px){main{padding:22px}.cats{grid-template-columns:repeat(3,minmax(0,1fr))}.items{grid-template-columns:repeat(2,minmax(0,1fr))}.body{padding:14px}.card h3{font-size:19px}}@media(min-width:900px){.items{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:370px){.brand img{width:40px}.brand strong{font-size:17px}.sub{font-size:7px}.lang{padding:7px}}
</style></head><body>
<header class="top"><div class="brand"><img src="assets/icon.svg" alt="Skumbria"><div><strong>SKUMBRIA</strong><div class="sub">BOULEVARD PREMIUM · FISH · SEAFOOD · GRILL</div></div><div class="langs"><button class="lang active" data-lang="uz">UZ</button><button class="lang" data-lang="ru">RU</button><button class="lang" data-lang="en">EN</button></div></div></header>
<main><section class="hero"><div class="eyebrow">PREMIUM CUISINE</div><h1 id="hero">Menyu</h1><p id="tag">Dengizdan dasturxoningizga.</p></section><input class="search" id="search" placeholder="Taom nomini qidiring…" type="search"><nav class="cats" id="cats"></nav><div class="head"><h2 id="heading">Barcha taomlar</h2><span class="count" id="count"></span></div><section class="items" id="items"></section><div class="status" id="status">Menyu yuklanmoqda…</div><div class="foot">FROM THE SEA TO YOUR TABLE · TASHKENT</div></main>
<div class="detail" id="detail"><div class="panel"><button class="close" id="close">✕</button><img id="dimg" class="detail-img" alt=""><h2 id="dtitle"></h2><p id="ddesc"></p><div id="dmeta"></div><div id="dprice" class="detail-price"></div></div></div>
<script>
const texts={uz:{all:"Barcha taomlar",search:"Taom nomini qidiring…",close:"Yopish",ready:"Menyu tayyor",offline:"Offline rejim · keshlangan menyu",empty:"Hech narsa topilmadi",weight:"Porsiya"},ru:{all:"Все блюда",search:"Поиск блюда…",close:"Закрыть",ready:"Меню готово",offline:"Автономный режим · сохранённое меню",empty:"Ничего не найдено",weight:"Порция"},en:{all:"All dishes",search:"Search dishes…",close:"Close",ready:"Menu ready",offline:"Offline mode · cached menu",empty:"No dishes found",weight:"Portion"}};
let data,lang=localStorage.getItem("skumbria-lang")||"uz",cat="all",query="";const $=id=>document.getElementById(id);const tr=o=>o?.[lang]||o?.en||"";const money=n=>new Intl.NumberFormat(lang==="en"?"en-US":lang==="ru"?"ru-RU":"uz-UZ").format(n)+(lang==="en"?" UZS":" so‘m");
function setLang(l){lang=l;localStorage.setItem("skumbria-lang",l);document.documentElement.lang=l;document.querySelectorAll(".lang").forEach(b=>b.classList.toggle("active",b.dataset.lang===l));$("hero").textContent={uz:"Menyu",ru:"Меню",en:"Menu"}[l];$("tag").textContent=data.brand.tagline[l];$("search").placeholder=texts[l].search;renderCats();renderItems()}
function renderCats(){const all={id:"all",name:{uz:texts.uz.all,ru:texts.ru.all,en:texts.en.all}};$("cats").innerHTML=[all,...data.categories].map(c=>`<button class="cat ${cat===c.id?"active":""}" data-id="${c.id}">${tr(c.name)}</button>`).join("");$("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.id;renderCats();renderItems();$("heading").textContent=cat==="all"?texts[lang].all:tr(data.categories.find(c=>c.id===cat).name)})}
function renderItems(){let a=data.items.filter(i=>(cat==="all"||i.categoryId===cat)&&(!query||[tr(i.name),tr(i.description)].join(" ").toLowerCase().includes(query.toLowerCase())));$("count").textContent=a.length;$("items").innerHTML=a.map(i=>`<article class="card ${i.id==="balik-ekmek"?"signature":""}" data-id="${i.id}"><div class="photo"><img loading="lazy" src="${i.image}" alt="${tr(i.name)}" onerror="this.remove();this.parentElement.textContent='✦'"></div><div class="body">${i.badge?`<span class="badge">${i.badge}</span>`:""}<h3>${tr(i.name)}</h3>${i.weight?`<div class="desc">${texts[lang].weight}: ${i.weight}</div>`:""}<p class="desc">${tr(i.description)}</p><div class="price">${i.priceUZS!=null?money(i.priceUZS):(i.priceOptions||[]).map(o=>money(o.priceUZS)).join(" · ")}</div></div></article>`).join("")||`<div class="empty">${texts[lang].empty}</div>`;$("items").querySelectorAll(".card").forEach(el=>el.onclick=()=>detail(data.items.find(i=>i.id===el.dataset.id)))}
function detail(i){$("dtitle").textContent=tr(i.name);$("ddesc").textContent=tr(i.description);$("dmeta").textContent=i.weight?texts[lang].weight+": "+i.weight:"";$("dimg").src=i.image;$("dprice").innerHTML=i.priceUZS!=null?money(i.priceUZS):(i.priceOptions||[]).map(o=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #d6b16b44"><span>${o.label}</span><b>${money(o.priceUZS)}</b></div>`).join("");$("detail").classList.add("open")}
$("close").onclick=()=>$("detail").classList.remove("open");$("detail").onclick=e=>{if(e.target===$("detail"))$("detail").classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("detail").classList.remove("open")});document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$("search").oninput=e=>{query=e.target.value;renderItems()};
async function start(){try{let r=await fetch("./menu.json");if(!r.ok)throw 0;data=await r.json();setLang(lang);$("status").textContent=navigator.onLine?texts[lang].ready:texts[lang].offline}catch(e){$("status").textContent="menu.json faylini tekshiring"}}window.addEventListener("online",()=>{$("status").textContent=texts[lang].ready});window.addEventListener("offline",()=>{$("status").textContent=texts[lang].offline});if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));start();
</script></body></html>
